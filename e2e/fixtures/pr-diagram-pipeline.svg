<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 466" width="1020" height="466" role="img" aria-label="Mobile JS ships from next without a build. Merging to next now publishes an over-the-air update when only JavaScript changed.">
<style>
.t{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6e9ee}.s{font:10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b93a1}.cap{font:600 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1px;fill:#7d8696}.l{font:600 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#aeb6c4}
.e{fill:none;stroke:#667082;stroke-width:1.5}.e-added{stroke:#4fb56a;stroke-width:2}.e-changed{stroke:#e0a030;stroke-width:2}.e-removed{stroke:#d9645f;stroke-dasharray:5 4;opacity:.85}
.flow{stroke-dasharray:6 6;animation:f 1.2s linear infinite}@keyframes f{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<defs><marker id="m-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#667082"/></marker><marker id="m-added" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4fb56a"/></marker><marker id="m-changed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a030"/></marker><marker id="m-removed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9645f"/></marker><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#262b34"/></pattern></defs>
<rect width="1020" height="466" rx="14" fill="#171a20"/><rect width="1020" height="466" rx="14" fill="url(#dots)"/>
<text x="26" y="38" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="17" font-weight="650" fill="#e6e9ee">Mobile JS ships from next without a build</text>
<rect x="368.5" y="23" width="74.8" height="20" rx="10" fill="none" stroke="#6b5220"/><text class="cap" x="377.5" y="37" style="fill:#e0a030">PIPELINE</text>
<rect x="14" y="56" width="992" height="349" rx="12" fill="#1e222a" stroke="#2c313b"/>
<g transform="translate(26 72)">
<text class="cap" x="0" y="14">TRIGGER</text>
<path d="M0 24H136" stroke="#333a46"/>
<g><rect x="0" y="88" width="136" height="58" rx="8" fill="#272c36" stroke="#e0a030" stroke-width="1.6"/><text class="t" x="12" y="114">push to next</text><text class="s" x="12" y="129">was: push to main</text><text class="l" x="128" y="101" text-anchor="end" font-size="8" style="fill:#f0b440">CHANGED</text></g>
<text class="cap" x="184" y="14">CHECK</text>
<path d="M184 24H308" stroke="#333a46"/>
<g><rect x="184" y="44" width="124" height="58" rx="8" fill="#272c36" stroke="#3b424e" stroke-width="1.2"/><text class="t" x="196" y="70">typecheck</text><text class="s" x="196" y="85">tsc -b</text></g>
<g><rect x="184" y="132" width="124" height="58" rx="8" fill="#272c36" stroke="#3b424e" stroke-width="1.2"/><text class="t" x="196" y="158">unit</text><text class="s" x="196" y="173">vitest</text></g>
<text class="cap" x="356" y="14">TEST</text>
<path d="M356 24H480" stroke="#333a46"/>
<g><rect x="356" y="88" width="124" height="58" rx="8" fill="#272c36" stroke="#3b424e" stroke-width="1.2"/><text class="t" x="368" y="114">e2e terminal</text><text class="s" x="368" y="129">playwright</text></g>
<text class="cap" x="648" y="14">PUBLISH</text>
<path d="M648 24H772" stroke="#333a46"/>
<g><rect x="648" y="88" width="124" height="58" rx="8" fill="#1f3327" stroke="#4fb56a" stroke-width="1.6"/><text class="t" x="660" y="114">OTA publish</text><text class="s" x="660" y="129">eas update</text><text class="l" x="764" y="101" text-anchor="end" font-size="8" style="fill:#6fd08a">NEW</text></g>
<text class="cap" x="820" y="14">AFTER</text>
<path d="M820 24H968" stroke="#333a46"/>
<g><rect x="820" y="44" width="148" height="58" rx="8" fill="#272c36" stroke="#3b424e" stroke-width="1.2"/><text class="t" x="832" y="70">notify</text><text class="s" x="832" y="85">slack</text></g>
<g><rect x="820" y="132" width="148" height="58" rx="8" fill="#1f3327" stroke="#4fb56a" stroke-width="1.6"/><text class="t" x="832" y="158">baseline</text><text class="s" x="832" y="173">after native builds</text><text class="l" x="960" y="145" text-anchor="end" font-size="8" style="fill:#6fd08a">NEW</text></g>
<path class="e" d="M136 111.6C161.9 111.6 158.1 73 184 73" marker-end="url(#m-neutral)"/>
<path class="e" d="M136 122.4C161.9 122.4 158.1 161 184 161" marker-end="url(#m-neutral)"/>
<path class="e" d="M308 73C333.9 73 330.1 111.6 356 111.6" marker-end="url(#m-neutral)"/>
<path class="e" d="M308 161C333.9 161 330.1 122.4 356 122.4" marker-end="url(#m-neutral)"/>
<path class="e e-added flow" d="M480 117C550.6 117 577.4 117 648 117" marker-end="url(#m-added)"/>
<path class="e e-added flow" d="M772 111.6C797.9 111.6 794.1 73 820 73" marker-end="url(#m-added)"/>
<path class="e e-added flow" d="M772 122.4C797.9 122.4 794.1 161 820 161" marker-end="url(#m-added)"/>
<rect x="0" y="216" width="968" height="99" rx="10" fill="#1a1d24" stroke="#2c313b"/>
<text class="cap" x="16" y="238">WHAT CHANGES FOR YOU</text>
<text class="s" x="16" y="260" fill="#f0b440" style="fill:#f0b440">·</text>
<text class="s" x="34" y="260" style="fill:#d5dae2">Merging to next ships JavaScript to phones within about 4 minutes, without a build.</text>
<text class="s" x="16" y="279" fill="#f0b440" style="fill:#f0b440">·</text>
<text class="s" x="34" y="279" style="fill:#d5dae2">Native changes are skipped: a fingerprint mismatch stops the publish job.</text>
<text class="s" x="16" y="298" fill="#f0b440" style="fill:#f0b440">·</text>
<text class="s" x="34" y="298" style="fill:#f0b440">New secret required: EXPO_TOKEN in the LaunchAgent environment.</text>
<rect x="495" y="108" width="138" height="18" rx="9" fill="#1e222a" stroke="#333a46"/><text class="l" x="564" y="120.5" text-anchor="middle" style="fill:#6fd08a">if mobile/** changed</text>
</g>
<circle cx="30" cy="423.5" r="4" fill="#e0a030"/><text class="s" x="39" y="427">changed</text><circle cx="107.8" cy="423.5" r="4" fill="#4fb56a"/><text class="s" x="116.8" y="427">new</text><text x="26" y="447" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11.5" fill="#d5dae2">Merging to next now publishes an over-the-air update when only JavaScript changed.</text>
</svg>
