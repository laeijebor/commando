<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Grid view</title>
<link rel="stylesheet" href="assets/tile.css">
<style>
  .grid { flex: 1; overflow: hidden; padding: 20px 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 18px; align-content: start; background: var(--surface-deep); }
  .card { display: flex; flex-direction: column; gap: 8px; }
  .card .t { position: relative; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px var(--border-mid); background: #000; }
  .card .t iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; border: 0; transform: scale(.2); transform-origin: 0 0; pointer-events: none; }
  .card .t .badge { position: absolute; right: 8px; top: 8px; padding: 4px 7px; border-radius: 999px; font: 700 11px/1 Inter, sans-serif; }
  .card .meta { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--text-soft); }
  .card .meta .n { font: 600 11px/1 var(--mono); color: var(--muted); }
  .card .meta .s { margin-left: auto; display: flex; gap: 6px; }
  .card.sel .t { box-shadow: 0 0 0 2px var(--accent); }
  .card.lift { transform: rotate(-2deg) translateY(-6px); }
  .card.lift .t { box-shadow: 0 0 0 2px var(--accent), 0 30px 60px rgba(0,0,0,.6); }
  .drop { border: 2px dashed var(--accent); border-radius: 8px; aspect-ratio: 16/9; display: grid; place-items: center; color: var(--accent); font-size: 12px; font-weight: 600; background: rgba(185,163,255,.05); }
  .legend { display: flex; gap: 14px; padding: 9px 14px; border-top: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; align-items: center; }
</style></head>
<body><div class="tile">
  <div data-chrome="grid"></div>
  <div class="grid" data-canvas-group="Grid">
    <div class="card" data-canvas-label="Slide 1 card"><div class="t"><iframe src="s1.html"></iframe><span class="badge q">? 1 question</span></div><div class="meta"><span class="n">01</span>Title<span class="s"></span></div></div>
    <div class="card" data-canvas-label="Slide 2 card"><div class="t"><iframe src="s2.html"></iframe><span class="badge c">💬 1</span></div><div class="meta"><span class="n">02</span>The problem</div></div>
    <div class="card" data-canvas-label="Slide 3 card"><div class="t"><iframe src="s3.html"></iframe></div><div class="meta"><span class="n">03</span>Root cause</div></div>
    <div class="card" data-canvas-label="Slide 4 card"><div class="t"><iframe src="s4.html"></iframe></div><div class="meta"><span class="n">04</span>Impact</div></div>
    <div class="card sel" data-canvas-label="Slide 5 card"><div class="t"><iframe src="s5.html"></iframe><span class="badge e">edited · round 2</span></div><div class="meta"><span class="n">05</span>Evidence chart<span class="s"><span class="chip e">diff vs round 1</span></span></div></div>
    <div class="drop" data-canvas-label="Drop target">Drop to move here</div>
    <div class="card" data-canvas-label="Slide 7 card"><div class="t"><iframe src="s7.html"></iframe></div><div class="meta"><span class="n">07</span>After</div></div>
    <div class="card lift" data-canvas-label="Dragged slide"><div class="t"><iframe src="s6.html"></iframe></div><div class="meta"><span class="n">06</span>What changed · moving…</div></div>
    <div class="card" data-canvas-label="Slide 8 card"><div class="t"><iframe src="s8.html"></iframe></div><div class="meta"><span class="n">08</span>Takeaways</div></div>
  </div>
  <div class="legend" data-canvas-label="Grid legend">
    <span class="chip q">? question</span><span class="chip c">💬 comments</span><span class="chip e">edited since last round</span>
    <span style="flex:1"></span><span>Drag to reorder · the move is sent to the agent as a note</span><span class="kbd">G</span>
  </div>
</div>
<script src="assets/chrome.js"></script>
<script>
  const fit = () => document.querySelectorAll('.t iframe').forEach((f) => { f.style.transform = `scale(${f.parentElement.clientWidth / 1280})` })
  addEventListener('resize', fit); fit()
</script>
</body></html>
